<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jagruthi — Women Safety System</title>
    <!-- Progressive Web App (PWA) Manifest & Meta Tags -->
    <link rel="manifest" href="./manifest.json?v=10">
    <meta name="theme-color" content="#dc2626">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jagruthi">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png?v=10">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png?v=10">
    <link rel="icon" type="image/png" sizes="64x64" href="./assets/icons/favicon.png?v=10">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit', sans-serif; }
        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            text-align: center;
            padding: 20px;
        }
        .splash-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .splash-logo { width:96px; height:96px; object-fit:contain; animation:pulse 1.8s infinite ease-in-out; filter: drop-shadow(0 6px 16px rgba(225, 29, 72, 0.45)); }
        .splash-title { font-size:1.7rem; font-weight:700; letter-spacing:0.5px; }
        .splash-sub { color:#94a3b8; font-size:0.95rem; }
        .spinner { width:32px; height:32px; border:3px solid rgba(255,255,255,0.15); border-top-color:#e11d48; border-radius:50%; animation:spin 0.8s linear infinite; margin-top:8px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform:scale(1); } 50% { transform:scale(1.05); } }
    </style>
</head>
<body>
    <div class="splash-card">
        <img src="./assets/icons/logo.png" alt="Jagruthi Logo" class="splash-logo">
        <h1 class="splash-title">Jagruthi</h1>
        <p class="splash-sub">Securing session and routing...</p>
        <div class="spinner"></div>
    </div>

    <script src="./pwaManager.js?v=14"></script>
    <script>
        (function() {
            const roleRoutes = {
                user: 'pages/user/index.html',
                emergency: 'pages/emergency/emergency.html',
                police: 'pages/police/police.html',
                patrol: 'pages/patrol/patrol.html',
                admin: 'pages/admin/admin.html'
            };

            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const userRole = localStorage.getItem('userRole');
            const search = window.location.search || '';

            if (isLoggedIn === 'true' && userRole && roleRoutes[userRole]) {
                window.location.replace(roleRoutes[userRole] + search);
            } else {
                window.location.replace('login.html' + search);
            }
        })();
    </script>
</body>
</html>
